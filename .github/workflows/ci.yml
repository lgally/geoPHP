name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
          extensions: dom

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run unit tests
        run: composer unit

      - name: Run input format tests
        run: composer test-input

      - name: Run performance smoke tests
        run: composer performance

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: dom

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check coding standards
        run: composer cs

      - name: Run static analysis
        run: composer stan
